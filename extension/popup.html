<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🛡️ Dark Pattern Detector</h2>
    
    <div class="card">
      <div class="info-row">
        <span class="label">Website:</span>
        <span id="website" class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Patterns Found:</span>
        <span id="patterns-found" class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Confidence:</span>
        <span id="confidence" class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Status:</span>
        <span id="status" class="value">Ready</span>
      </div>
    </div>

    <button id="rescan-btn">Rescan Page</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
